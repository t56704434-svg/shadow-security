<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>SHADOW SYSTEM</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:black;
  color:#00ff66;
  font-family:monospace;
  overflow:hidden;
}

/* عام */
.center{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* لوغو */
.logo{
  font-size:44px;
  letter-spacing:6px;
  margin-bottom:10px;
  animation:flicker 1.2s infinite;
}
.user{
  color:#00aaff;
  margin-bottom:25px;
}

/* نص */
.line{
  font-size:18px;
  display:none;
  margin:4px 0;
}
.cursor{
  margin-top:10px;
  animation:blink 1s infinite;
}

/* تحميل */
.barBox{
  width:70%;
  border:1px solid #0f0;
  margin-top:15px;
}
.bar{
  height:14px;
  width:0%;
  background:#0f0;
}

/* رعب */
.warning{
  color:red;
  font-size:34px;
  animation:flicker .1s infinite;
}
.shake{
  animation:shake .12s infinite;
}
.flash{
  animation:flash .15s infinite;
}

/* إطفاء وهمي */
#off{
  background:black;
  color:#0f0;
  font-size:22px;
}

/* انيميشن */
@keyframes blink{50%{opacity:0}}
@keyframes flicker{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
@keyframes shake{
  0%{transform:translate(0)}
  25%{transform:translate(5px,0)}
  50%{transform:translate(-5px,0)}
  75%{transform:translate(0,5px)}
  100%{transform:translate(0)}
}
@keyframes flash{
  0%{background:black}
  50%{background:#200}
  100%{background:black}
}
</style>
</head>

<body>

<!-- مرحلة 1 -->
<div id="s1" class="center">
  <div class="logo">SHADOW</div>
  <div class="user">@v_zsz</div>

  <div class="line">Initializing core modules...</div>
  <div class="line">Checking system integrity...</div>
  <div class="line">Bypassing visual layer...</div>

  <div class="barBox">
    <div class="bar" id="bar"></div>
  </div>

  <div class="cursor">▮</div>
</div>

<!-- مرحلة 2 رعب -->
<div id="s2" class="center" style="display:none">
  <div class="warning shake">
    SYSTEM BREACH DETECTED
  </div>
  <div style="color:yellow;margin-top:15px" class="flicker">
    DO NOT CLOSE THIS PAGE
  </div>
</div>

<!-- إطفاء -->
<div id="off" class="center" style="display:none">
  SYSTEM IS SHUTTING DOWN…<br>
  SAVING MEMORY BLOCKS…
</div>

<script>
const lines=document.querySelectorAll(".line");
const bar=document.getElementById("bar");
const s1=document.getElementById("s1");
const s2=document.getElementById("s2");
const off=document.getElementById("off");

let i=0,load=0;

/* صوت صفارة */
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC();
function beep(f,t){
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.frequency.value=f;
  o.connect(g); g.connect(ctx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t);
  o.stop(ctx.currentTime+t);
}

/* إظهار النص */
const textInt=setInterval(()=>{
  if(i<lines.length){
    lines[i].style.display="block";
    i++;
  }
},800);

/* تحميل */
const loadInt=setInterval(()=>{
  if(load<100){
    load+=2;
    bar.style.width=load+"%";
  }
},120);

/* انتقال */
setTimeout(()=>{
  clearInterval(textInt);
  clearInterval(loadInt);
  beep(900,.8);
  s1.style.display="none";
  s2.style.display="flex";
  document.body.classList.add("flash");
},9000);

/* إطفاء */
setTimeout(()=>{
  beep(200,.4);
  s2.style.display="none";
  off.style.display="flex";
},14000);

/* رجوع طبيعي */
setTimeout(()=>{
  document.body.classList.remove("flash");
  off.style.display="none";
  s1.style.display="flex";
  lines.forEach(l=>l.style.display="none");
  bar.style.width="0%";
  i=0; load=0;
},19000);
</script>

</body>
</html>
