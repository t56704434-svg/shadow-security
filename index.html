<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOW_CORE | NEURAL_INTERFACE</title>
    <style>
        body {
            background-color: #050505;
            color: #00ecff;
            font-family: 'Tahoma', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }
        #chat-container {
            width: 95%;
            max-width: 600px;
            height: 85vh;
            border: 1px solid #00ecff;
            background: rgba(0, 10, 20, 0.9);
            box-shadow: 0 0 25px rgba(0, 236, 255, 0.3);
            display: flex;
            flex-direction: column;
        }
        #chat-window {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #00ecff;
            scrollbar-width: none;
        }
        .message { margin-bottom: 15px; line-height: 1.6; min-height: 20px; }
        .ai { color: #00ecff; text-align: right; }
        .user { color: #fff; text-shadow: 0 0 5px #fff; text-align: right; border-bottom: 1px solid #111; padding-bottom: 5px; }
        
        #input-area {
            display: flex;
            padding: 15px;
            background: #000;
            align-items: center;
        }
        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ecff;
            font-family: inherit;
            font-size: 1.1em;
            outline: none;
            text-align: right;
        }
        .cursor { animation: blink 1s infinite; color: #00ecff; font-weight: bold; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="chat-window" id="chatWindow">
            <div class="message ai" id="welcome-msg"></div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="أدخل الأمر..." autocomplete="off" autofocus>
            <span class="cursor">█</span>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        const responses = {
            "هلا": "أهلاً بك يا Shadow. الأنظمة مستقرة وجاهزة للعمل.",
            "الحالة": "المعالج: 12% | الحرارة: 40C | الموقع: عقدة ذي قار | التشفير: نشط.",
            "من أنت": "أنا SHADOW_CORE V1.0، ذكاء اصطناعي مخصص للأمن السيبراني والتحليل الرقمي.",
            "اختراق": "تم رفض الوصول. يرجى تقديم تصريح من المستوى الثاني.",
            "مساعدة": "الأوامر المتاحة: هلا، الحالة، من أنت، فحص النظام، مسح البيانات.",
            "فحص النظام": "جاري فحص الثغرات... لم يتم اكتشاف أي تهديدات خارجية حالياً.",
            "hello": "WELCOME BACK, SHADOW. SYSTEMS ONLINE.",
            "status": "CPU: 12% | TEMP: 40C | NETWORK: SECURE"
        };

        // وظيفة الكتابة التدريجية (Typewriter)
        function typeWriter(element, text, i = 0) {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                setTimeout(() => typeWriter(element, text, i + 1), 40); // سرعة الكتابة 40ms
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        function addMessage(text, type) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            
            if (type === 'user') {
                msg.innerHTML = `> ${text}`;
                chatWindow.appendChild(msg);
            } else {
                msg.innerHTML = `[ SHADOW_CORE ] : `;
                chatWindow.appendChild(msg);
                typeWriter(msg, text); // تشغيل تأثير الكتابة للـ AI فقط
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // رسالة ترحيبية عند التشغيل
        setTimeout(() => {
            addMessage("تم تهيئة الاتصال بنجاح. بانتظار أوامرك يا Shadow...", "ai");
        }, 500);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && userInput.value.trim() !== "") {
                const text = userInput.value.toLowerCase().trim();
                addMessage(userInput.value, 'user');
                userInput.value = "";

                setTimeout(() => {
                    const response = responses[text] || "أمر غير معروف: لم يتم العثور على البيانات في قاعدة البيانات العصبية.";
                    addMessage(response, 'ai');
                }, 600);
            }
        });
    </script>
</body>
</html>
