<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shadow AI Chat 🤖</title>
<style>
body{
    background:#000;
    color:#00ff41;
    font-family:monospace;
    text-align:center;
}
#chat{
    width:90%;
    height:400px;
    margin:auto;
    border:1px solid #00ff41;
    overflow:auto;
    padding:10px;
    text-align:left;
}
input{
    width:70%;
    padding:10px;
}
button{
    padding:10px;
}
.user{color:white;}
.ai{color:#00ff41;}
</style>
</head>
<body>

<h2>🤖 Shadow AI (With Memory)</h2>

<div id="chat"></div>

<input id="input" placeholder="اكتب رسالتك">
<button onclick="send()">Send</button>

<script>
let memory = JSON.parse(localStorage.getItem("memory")) || [];

function render(){
    let chat = document.getElementById("chat");
    chat.innerHTML = "";
    memory.forEach(m=>{
        chat.innerHTML += `<div class='${m.role}'>${m.role === "user" ? "🧑" : "🤖"} ${m.text}</div>`;
    });
    chat.scrollTop = chat.scrollHeight;
}

render();

async function send(){
    let input = document.getElementById("input").value;

    memory.push({role:"user", text:input});
    render();

    let reply = await getAI(input);

    memory.push({role:"ai", text:reply});
    localStorage.setItem("memory", JSON.stringify(memory));

    render();
}

async function getAI(text){
    // نسخة ذكية بسيطة (ممكن نربطها لاحقاً بـ API)
    
    text = text.toLowerCase();

    if(text.includes("اسم")) return "أقدر أتذكر كلامك لأن عندي ذاكرة 🧠";
    if(text.includes("مرحبا")) return "أهلاً بك 👋 أنا Shadow AI";
    if(text.includes("شنو")) return "أنا نموذج تجريبي لكن أتعلم من محادثتك";

    return "أنا أفكر في كلامك... 🤖";
}
</script>

</body>
</html>
